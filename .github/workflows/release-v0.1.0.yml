name: Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.1.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    name: Validate and publish initial release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate release candidate
        run: |
          npm run check
          npm audit --omit=dev

      - name: Create or verify v0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes=$(cat <<'EOF'
          Project Glassbox v0.1.0 is the first public research-prototype release of open infrastructure for observable, verifiable, human-governed AI.

          Highlights include the interactive Context Microscope, LLM/deterministic/hybrid Agent Layer, evidence provenance, deterministic replay, human-review controls, audit export, and explicit epistemic safety boundaries.

          Project Glassbox does not expose private chain-of-thought, translate neural activity into literal thoughts, or fabricate missing context, evidence, telemetry, or certainty. It is not a production assurance or compliance system.

          See CHANGELOG.md for the complete release summary.
          EOF
          )
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release edit v0.1.0 \
              --title "Project Glassbox v0.1.0" \
              --notes "$release_notes"
          else
            gh release create v0.1.0 \
              --target "$GITHUB_SHA" \
              --title "Project Glassbox v0.1.0" \
              --notes "$release_notes"
          fi
